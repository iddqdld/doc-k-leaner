services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - redis
      - postgres
    environment:
      - DOCKCLEANER_REDIS_URL=redis://redis:6379
      - DOCKCLEANER_POSTGRES_URL=postgresql://dockcleaner:dockcleaner@postgres:5432/dockcleaner
      - DOCKCLEANER_STORAGE_DIR=/app/data/storage
    volumes:
      - ./data/storage:/app/data/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - ./data/redis:/data

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=dockcleaner
      - POSTGRES_USER=dockcleaner
      - POSTGRES_PASSWORD=dockcleaner
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

volumes: {}
