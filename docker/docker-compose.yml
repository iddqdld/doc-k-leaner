services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - redis
      - postgres
    environment:
      - DOCKCLEANER_REDIS_URL=redis://redis:6379
      - DOCKCLEANER_POSTGRES_URL=postgresql://dockcleaner:dockcleaner@postgres:5432/dockcleaner
      - DOCKCLEANER_STORAGE_DIR=/app/data/storage
      - DOCKCLEANER_SCAN_DIR=/app/data/scans
      - DOCKCLEANER_GITHUB_REPO=iddqdld/doc-k-leaner
      - DOCKCLEANER_GITHUB_BRANCH=dev
      # Local Ollama integration (Windows / Docker Desktop)
      - DOCKCLEANER_OLLAMA_BASE_URL=http://host.docker.internal:11434
      - DOCKCLEANER_SANDBOX_LLM_MODEL=phi3:mini
      - DOCKCLEANER_SANDBOX_LLM_TEMPERATURE=0.0
      - DOCKCLEANER_SOLIDITYGUARD_URL=http://solidityguard:8000
      # Auth (values loaded from docker/.env)
      - DOCKCLEANER_JWT_SECRET=${DOCKCLEANER_JWT_SECRET}
      - DOCKCLEANER_GOOGLE_CLIENT_ID=${DOCKCLEANER_GOOGLE_CLIENT_ID}
      - DOCKCLEANER_GOOGLE_CLIENT_SECRET=${DOCKCLEANER_GOOGLE_CLIENT_SECRET}
    volumes:
      - ./data/storage:/app/data/storage
      - ./data/scans:/app/data/scans
      - /var/run/docker.sock:/var/run/docker.sock

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - ./data/redis:/data

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=dockcleaner
      - POSTGRES_USER=dockcleaner
      - POSTGRES_PASSWORD=dockcleaner
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  trivy:
    image: aquasec/trivy:0.69.1
    container_name: trivy
    entrypoint: ["sh", "-c", "sleep infinity"]
    volumes:
      - ./data/storage:/data/storage
      - ./trivy-secret.yaml:/etc/trivy/trivy-secret.yaml:ro

  solidityguard:
    build:
      context: ../SolidityGuard
      dockerfile: docker/Dockerfile.web
    ports:
      - "8001:8000"
    environment:
      - JWT_SECRET=dockcleaner-local-secret
    volumes:
      - ./data/solidity:/app/data
    restart: unless-stopped

volumes: {}
